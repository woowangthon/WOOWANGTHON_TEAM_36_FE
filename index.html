<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘: 학사모 쓴 금색 동전 (SVG로 어떤 크기에서도 선명, PNG는 SVG를 못 읽는 브라우저용). 홈 화면 아이콘은 크림 배경 -->
    <!-- 사파리는 예전 아이콘을 오래 저장해 두므로 주소에 ?v=를 붙여 새로 받게 하고, 아이콘을 바꾸면 숫자를 올립니다.
         사파리가 따로 찾는 /favicon.ico도 같은 그림으로 둡니다 -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장학금 매칭</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
